name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show supported build toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test core and regression cases
        run: swift test --no-parallel
      - name: Verify build-check exit codes
        shell: zsh -e {0}
        run: |
          scripts/check.sh
          if scripts/check.sh --marika-invalid-option; then
            echo 'check.sh incorrectly accepted a failed build' >&2
            exit 1
          fi
      - name: Build and verify app bundle
        run: |
          scripts/build-app.sh release
          codesign --verify --deep --strict build/Marika.app
      - name: Verify signed update packaging with temporary keys
        run: python3 scripts/test-update-package.py
      - name: Run native UI regressions with isolated fixtures
        run: |
          swift build
          python3 scripts/ui-checks.py --artifacts "${{ runner.temp }}/marika-ui-checks"
      - name: Retain native UI failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-diagnostics
          path: |
            ${{ runner.temp }}/marika-ui-checks/**/*.log
            ${{ runner.temp }}/marika-ui-checks/**/*.png
            ${{ runner.temp }}/marika-ui-checks/**/*.json
          if-no-files-found: ignore
          retention-days: 7
